<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Elias Browser Work</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header><div class="brand"><span>✦</span><strong>ELIAS</strong></div><a href="https://elias-ai-chi.vercel.app/chat" target="_blank">Open full chat ↗</a></header>
  <main>
    <section class="intro"><div class="eyebrow">COMPUTER USE</div><h1>Let Elias work in your browser.</h1><p>Give Elias an objective. It can inspect the active page and request approved browser actions while you stay in control.</p></section>
    <section class="control-card"><div class="control-head"><div><strong>Browser control</strong><small id="control-detail">Not connected to an Elias task.</small></div><span id="control-dot" class="dot"></span></div><button id="toggle-control" class="secondary" type="button">Enable on this task</button></section>
    <label for="prompt">What should Elias do?</label>
    <textarea id="prompt" rows="4" placeholder="Compare these plans, fill the draft form, or find the best matching option…"></textarea>
    <button id="send" type="button">Start browser task</button>
    <p id="status" role="status"></p>
    <section id="progress" hidden><div class="eyebrow">LIVE TASK</div><h2 id="title"></h2><div class="meter"><span id="meter"></span></div><div id="count"></div><div id="steps"></div><div id="approval" class="approval" hidden></div></section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
