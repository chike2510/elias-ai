name: CI

on:
  pull_request:
  push:
    branches: [main, "elias/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELIAS_AGENT_BASE_URL: http://127.0.0.1:5599
      ELIAS_AGENT_PROVIDERS: custom
    # Real Postgres for the integration runs: pglite-socket shares one session between client connections,
    # which breaks when the app opens more than one postgres.js client.
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Start the scripted model and an evals database
        run: |
          nohup node scripts/mock-llm.mjs 5599 > /tmp/mock.log 2>&1 &
          psql -h 127.0.0.1 -U postgres -c 'create database evals'
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5599) 2>/dev/null && break; sleep 1; done

      - name: Integration test (full-text memory, no pgvector)
        run: npx -y tsx scripts/test-assistant.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres

      - name: Integration test (hybrid memory with pgvector)
        run: npx -y tsx scripts/test-assistant.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5433/postgres
          ELIAS_EMBED_PROVIDER: hash
          TEST_EXPECT_VECTOR: "1"

      - name: Coding agent integration (working set store, mock GitHub)
        run: npx -y tsx scripts/test-code.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres

      - name: Google integration (encrypted tokens, refresh/expiry, reconnect card, mock Google)
        run: npx -y tsx scripts/test-google.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres

      - name: Evals (deterministic, scripted model)
        run: npx -y tsx evals/run.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/evals

      - name: Coding agent evals (scripted model, mock GitHub)
        run: npx -y tsx evals/code.ts
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/evals

      - name: Logs on failure
        if: failure()
        run: tail -n 50 /tmp/mock.log || true
